      .bg-picture-layer {

        inset: 0;
        opacity: 0;
        transition: opacity 0.45s ease-out;

      .bg-picture-layer.active {
        opacity: 1;
      }
      .bg-layer {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        opacity: 0;
        transition: opacity 0.45s ease-out;
      }
      .bg-layer.active {
        opacity: 1;
      }
      @media (min-width: 769px) {
        .bg-layer {
          filter: brightness(0.78) contrast(1.04) saturate(1.05);
        }
      }
      .bg-vignette {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: radial-gradient(circle at center, transparent 32%, rgba(10, 1, 3, 0.52) 100%);
      }

      /* Desktop Dynamic Island Core Layout (Zero Layout Shift) */
      .universal-dynamic-island-container {
        position: fixed;
        top: 1.15rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        width: auto;
        max-width: min(94vw, 560px);
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: none;
        contain: layout style;
      }
      .dynamic-island {
        pointer-events: auto;
        width: auto;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(18, 2, 6, 0.94);
        backdrop-filter: blur(28px) saturate(180%);
        -webkit-backdrop-filter: blur(28px) saturate(180%);
        border: 1px solid rgba(255, 207, 64, 0.35);
        border-radius: 32px;
        box-shadow: 0 14px 40px -4px rgba(0, 0, 0, 0.88), 0 0 22px -4px rgba(255, 207, 64, 0.22);
      }
      .island-state {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.38rem 0.85rem;
        min-height: 48px;
        gap: 0.75rem;
        box-sizing: border-box;
      }

      .hero-viewport-section {

        z-index: 10;

        padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));

        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;

        padding: 1.25rem 1rem 0.5rem;
        gap: clamp(0.45rem, 1.8vh, 1.15rem);
        max-width: 100%;

        font-weight: 400;
        line-height: 1.06;
        color: var(--heritage-gold);
        letter-spacing: 0.015em;
        min-height: 1.2em;

        font-weight: 600;
        color: rgba(255, 235, 200, 0.94);

      .festive-countdown-card {
        margin-top: 0.25rem;

        flex-direction: column;
        align-items: center;

        box-shadow: 0 18px 44px -8px rgba(0, 0, 0, 0.88), 0 0 28px -6px rgba(255, 207, 64, 0.26);

        user-select: none;
        max-width: min(92vw, 450px);
        min-height: 110px;
        contain: layout style;
      }

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        width: 100%;

        justify-content: center;

        justify-content: center;

        font-size: 0.75rem;
        font-weight: 600;

        margin-top: 0.45rem;
        padding-top: 0.45rem;
        border-top: 1px solid rgba(255, 207, 64, 0.2);
        width: 100%;
        min-height: 24px;
      }

      /* Floating Sound & Story Triggers */
      .floating-sound-triggers {
        display: flex;
        gap: 0.55rem;
        margin-top: 0.35rem;
        flex-wrap: wrap;
        justify-content: center;
        min-height: 44px;

      /* Off-screen Content Visibility Optimization (60-120fps Mobile Scrolling & Zero TBT/INP) */
      .invitation-section,
      .formal-invitation-section,
      .invitation-letterhead-section,
      .full-breadth-festive-bar,

        content-visibility: auto;
        contain-intrinsic-size: 1px 750px;
      }

      @media (max-width: 768px) {
        html, body, .app-wrapper {
          min-height: 100vh;
          min-height: 100dvh;
          min-height: 100svh;
        }
        .hero-viewport-section {
          min-height: 100vh;
          min-height: 100dvh;
          min-height: 100svh;
          padding-top: calc(max(8px, env(safe-area-inset-top, 0px)) + 58px);
          padding-bottom: calc(max(10px, env(safe-area-inset-bottom, 0px)) + 12px);
          padding-left: max(12px, env(safe-area-inset-left, 0px));
          padding-right: max(12px, env(safe-area-inset-right, 0px));
        }
        .universal-dynamic-island-container {
          top: 0;
          left: 0;
          right: 0;
          transform: none;
          width: 100%;
          padding: max(8px, env(safe-area-inset-top, 0px)) 0.75rem 0;
        }
        .festive-countdown-card {
          width: 100%;
          max-width: 360px;
        }
        button,
        .btn,
        .nav-action-btn,
        .vibe-pill,
        .sound-trigger-pill,
        .gallery-filter-chip,
        .onnota-filter-chip,
        .tab-btn,
        .tab-pill,
        .welcome-choice-btn,
        .hero-scroll-indicator,
        .island-auth-btn,
        .island-lang-pill,
        .island-lang-pill-mini,
        .island-expand-btn,
        .island-ctrl-btn,
        .island-vibe-chip,
